name: Daily Job Radar Refresh Pipeline

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Job Radar Crawler
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawler/run.py

      - name: Run Automated Tests
        run: |
          python -m unittest discover tests

      - name: Commit and Push Updated Dataset
        run: |
          # Keep public/data/jobs.json in sync with data/jobs.json (for static Vercel hosting)
          mkdir -p public/data
          cp data/jobs.json public/data/jobs.json

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json public/data/jobs.json
          if git diff --staged --quiet; then
            echo "No changes in dataset to commit."
          else
            git commit -m "auto: daily refresh of verified tech jobs dataset [skip ci]"
            git push
          fi
